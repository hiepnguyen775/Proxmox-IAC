name: Infrastructure Deploy

on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - 'ansible/**'

env:
  TF_VERSION: "1.9.0"
  ANSIBLE_VERSION: "9.5.1"

jobs:
  # =============================================
  #  TERRAFORM PLAN  (PR & push)
  # =============================================
  terraform-plan:
    name: Terraform Plan
    runs-on: self-hosted   # Runner nằm trong mạng Proxmox
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -upgrade
        env:
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -no-color
        env:
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_vm_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan
          retention-days: 5

  # =============================================
  #  TERRAFORM APPLY  (main branch only)
  # =============================================
  terraform-apply:
    name: Terraform Apply
    runs-on: self-hosted
    needs: terraform-plan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: terraform
    environment: production   # Cần approval trong GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init
        env:
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_proxmox_api_token: ${{ secrets.PROXMOX_API_TOKEN }}
          TF_VAR_vm_ssh_public_key: ${{ secrets.VM_SSH_PUBLIC_KEY }}

  # =============================================
  #  ANSIBLE CONFIGURE  (sau terraform apply)
  # =============================================
  ansible-configure:
    name: Ansible Configure
    runs-on: self-hosted
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    defaults:
      run:
        working-directory: ansible

    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          pip3 install ansible==${{ env.ANSIBLE_VERSION }}
          ansible-galaxy collection install community.general ansible.posix

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > ~/.vault_pass
        shell: bash

      - name: Write SSH key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Wait for VMs to boot (60s)
        run: sleep 60

      - name: Ansible provision (base OS)
        run: |
          ansible-playbook playbooks/provision.yml \
            -e "PROXMOX_TOKEN_SECRET=${{ secrets.PROXMOX_TOKEN_SECRET }}"
        env:
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}

      - name: Ansible configure (apps)
        run: |
          ansible-playbook playbooks/configure.yml
        env:
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}

  # =============================================
  #  NOTIFY
  # =============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [ansible-configure]
    if: always()

    steps:
      - name: Send Telegram notification
        if: vars.TELEGRAM_ENABLED == 'true'
        run: |
          STATUS="${{ needs.ansible-configure.result }}"
          EMOJI=$([ "$STATUS" = "success" ] && echo "✅" || echo "❌")
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="${EMOJI} Proxmox IaC deploy: ${STATUS}
Commit: ${{ github.sha }}
Branch: ${{ github.ref_name }}"
